<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for Webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #454747;
        }
    </style>

<body class="bg-surface-container-lowest text-on-surface min-h-screen font-body-md overflow-hidden antialiased">
<!-- Faux Dashboard Background for context -->
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 50% 50%, #1f1f1f 0%, #0e0e0e 100%);"></div>
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-[#000000]/70 backdrop-blur-md z-50 flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Modal Container (Level 2 Elevation) -->
<div class="w-full max-w-2xl bg-surface-container border border-surface-container-high rounded-xl flex flex-col max-h-[921px] shadow-2xl relative overflow-hidden transform transition-all">
<!-- Modal Header -->
<div class="flex items-center justify-between p-stack-lg border-b border-surface-container-high shrink-0">
<div class="flex items-center gap-stack-sm">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="settings">settings</span>
<h2 class="font-headline-md text-headline-md text-on-surface">User Settings</h2>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full hover:bg-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-stack-lg overflow-y-auto flex flex-col gap-stack-lg">
<!-- Profile Section -->
<section class="flex flex-col gap-stack-md">
<h3 class="font-label-md text-label-md text-primary uppercase tracking-wider flex items-center gap-2">
<span class="w-1 h-3 bg-primary rounded-full"></span> Profile Details
                    </h3>
<!-- Drag & Drop Avatar -->
<div class="flex flex-col sm:flex-row items-center sm:items-start gap-stack-lg mt-2">
<div class="w-28 h-28 shrink-0 rounded-full bg-surface border-2 border-dashed border-outline-variant hover:border-primary flex items-center justify-center relative overflow-hidden group cursor-pointer transition-colors duration-300">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-30 transition-opacity duration-300" data-alt="A stylized, high-contrast digital portrait of a user for an avatar, featuring deep black backgrounds with precise, luminous orange light accents illuminating a sleek, modern geometric facial structure." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeaFAE-jsZIpoAbRdSO7_ijK8OwYm1_flHk6Pn4RjERzesoi1c0Yna6fhZJiJKpNAhM3_drA-tckbjBWD8UZwYBupTv4iQHl5jkUwCjhz5BGtKQ9_q4O5hPqrBfvgjwkaf2qshE906UBgdah_TJJXFLT8rGVXJQZpS-RkIcNaiG6lXT-JQcdaGZ4FfF3ycS8JyOH3ALN1LsFNITIR8bRCAl4LkLPPBpbFt3OxYdcUIv76K10BTfrh1SfhptpP6pLdQ3WgmIIMK1-W7"/>
<div class="absolute inset-0 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary mb-1" data-icon="cloud_upload">cloud_upload</span>
<span class="font-label-sm text-label-sm text-primary">Upload</span>
</div>
</div>
<div class="flex flex-col justify-center text-center sm:text-left h-full pt-2">
<span class="font-body-lg text-body-lg text-on-surface mb-1">Avatar Image</span>
<span class="font-body-md text-body-md text-on-surface-variant max-w-xs">Drag and drop a new image here, or click to browse. We recommend a 256x256px PNG or JPG.</span>
</div>
</div>
<!-- Text Inputs -->
<div class="flex flex-col gap-stack-md mt-4">
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant">Display Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="person">person</span>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg py-3 pl-10 pr-3 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50" type="text" value="NeonGlider_99"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant">About Me</label>
<div class="relative">
<textarea class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg p-3 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/50 resize-none" rows="3">Navigating the digital ether.</textarea>
</div>
</div>
</div>
</section>
<hr class="border-surface-container-high my-2"/>
<!-- Audio/Video Section -->
<section class="flex flex-col gap-stack-md">
<h3 class="font-label-md text-label-md text-primary uppercase tracking-wider flex items-center gap-2">
<span class="w-1 h-3 bg-primary rounded-full"></span> Hardware Devices
                    </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-lg mt-2">
<!-- Microphone Dropdown -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant">Microphone Input</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="mic">mic</span>
<select class="w-full appearance-none bg-surface text-on-surface border border-outline-variant rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option>System Default (Shure SM7B)</option>
<option>Built-in Microphone</option>
<option>Virtual Audio Cable</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
<!-- Active Volume Meter Simulation -->
<div class="flex items-center gap-2 mt-2 px-1">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant" data-icon="volume_up">volume_up</span>
<div class="flex-1 h-1.5 bg-surface-container-highest rounded-full overflow-hidden flex">
<div class="h-full bg-primary rounded-full w-[35%] transition-all duration-150 ease-out shadow-[0_0_8px_rgba(255,92,0,0.8)]" id="mic-level"></div>
</div>
</div>
</div>
<!-- Camera Dropdown -->
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant">Video Source</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="videocam">videocam</span>
<select class="w-full appearance-none bg-surface text-on-surface border border-outline-variant rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
<option>Sony A7IV (Capture Card)</option>
<option>FaceTime HD Camera</option>
<option>OBS Virtual Camera</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Camera Preview Box -->
<div class="mt-4 w-full h-40 md:h-56 rounded-xl bg-surface border border-surface-container-high relative overflow-hidden flex items-center justify-center group">
<!-- Simulated Camera Noise / Blank State -->
<div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiIGZpbGwtb3BhY2l0eT0iMC4wNSIvPjwvc3ZnPg==')] pointer-events-none"></div>
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-4xl text-on-surface-variant" data-icon="videocam_off">videocam_off</span>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container/80 px-3 py-1.5 rounded-full backdrop-blur-sm border border-surface-container-high">Preview Disabled</span>
</div>
<button class="absolute bottom-4 right-4 bg-surface-container-highest hover:bg-surface-variant text-on-surface px-4 py-2 rounded-lg font-label-md text-label-md transition-colors border border-outline-variant flex items-center gap-2 opacity-0 group-hover:opacity-100">
<span class="material-symbols-outlined text-[18px]" data-icon="power_settings_new">power_settings_new</span> Test Video
                        </button>
</div>
</section>
<!-- Bottom padding to ensure scroll clearance -->
<div class="h-4"></div>
</div>
<!-- Modal Footer -->
<div class="flex items-center justify-end gap-stack-md p-stack-lg border-t border-surface-container-high bg-surface-container shrink-0">
<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-variant transition-colors border border-outline-variant">
                    Cancel
                </button>
<button class="px-6 py-2.5 rounded-lg font-label-md text-label-md bg-primary-container text-on-primary-container hover:bg-primary hover:text-on-primary transition-all shadow-[0_0_15px_rgba(255,92,0,0.15)] hover:shadow-[0_0_20px_rgba(255,92,0,0.3)] active:scale-95 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="save">save</span>
                    Save Changes
                </button>
</div>
</div>
</div>
<!-- Script for subtle mic level animation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const micLevel = document.getElementById('mic-level');
            if(micLevel) {
                setInterval(() => {
                    // Randomize width between 10% and 80% to simulate speech
                    const randomWidth = Math.floor(Math.random() * 70) + 10;
                    micLevel.style.width = `${randomWidth}%`;
                }, 200);
            }
        });
    </script>
</body></html>
